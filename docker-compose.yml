services:
  mysql:
    image: mysql:8.4
    container_name: rtc-passenger-care-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
      MYSQL_DATABASE: rtc_passenger_care
    ports:
      - "3306:3306"
    volumes:
      - rtc_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  rtc_mysql_data: