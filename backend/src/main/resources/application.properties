spring.application.name=rtc-passenger-care
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/rtcdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItYXBzcnRjLXJ0Yy1wYXNzZW5nZXItY2FyZS1zeXN0ZW0tMjAyNg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.seed.admin-email=${ADMIN_EMAIL:admin@example.com}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
